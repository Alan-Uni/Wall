<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Inicio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="welcome-container">
        <h1 id="welcomeMessage">Cargando...</h1>
        <p>Has iniciado sesión correctamente y estás viendo contenido protegido.</p>
        <button id="logoutButton">Cerrar Sesión</button>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const welcomeMessage = document.getElementById('welcomeMessage');
        const logoutButton = document.getElementById('logoutButton');

        // Si no hay token, no se puede estar aquí
        if (!token) {
            window.location.href = '/login';
        } else {
            // Usa el token para pedir los datos protegidos
            fetch('/api/data', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error('Token inválido o expirado.');
                }
                return res.json();
            })
            .then(data => {
                welcomeMessage.textContent = data.message;
            })
            .catch(err => {
                console.error('Error de autenticación:', err);
                localStorage.removeItem('token'); // Limpia el token inválido
                window.location.href = '/login';
            });
        }
        
        logoutButton.addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = '/login';
        });
    </script>
</body>
</html>
